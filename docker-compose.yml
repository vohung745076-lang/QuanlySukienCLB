version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: beeclub_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-beeclub_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-beeclub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - beeclub_network

  # 2. Backend RESTful API Service (Node.js / Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beeclub_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-beeclub_db}
      JWT_SECRET: ${JWT_SECRET:-beeclub_production_super_secret_jwt_key_2026}
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-beeclub_production_refresh_secret_key_2026}
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - beeclub_network

  # 3. Frontend Web App (React / Vite Container)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beeclub_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - beeclub_network

  # 4. Nginx Reverse Proxy (Cổng giao tiếp chính 80)
  nginx:
    image: nginx:alpine
    container_name: beeclub_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - beeclub_network

volumes:
  postgres_data:
    name: beeclub_postgres_data

networks:
  beeclub_network:
    name: beeclub_network
    driver: bridge
